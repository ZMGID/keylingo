name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to (e.g. v2.9.0)'
        required: true
        default: 'v2.9.4'
      ref:
        description: 'Git ref to build from (branch/tag/commit)'
        required: true
        default: 'main'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

jobs:
  create-release:
    # Both platform jobs upload into this release. Creating it first avoids a
    # race where two tauri-action steps try to open the same tag.
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          extra=()
          case "$RELEASE_TAG" in
            *beta*|*alpha*|*rc*) extra+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kivio Desktop $RELEASE_TAG" \
            --notes "Automated macOS (Apple Silicon) + Windows (x64 installer and portable zip) build for ${RELEASE_TAG}. Built from: ${BUILD_REF}." \
            --verify-tag \
            "${extra[@]}"

  tauri-release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon; the DMG name stays *_aarch64.dmg.
          - platform: macos-latest
            name: macOS
            args: --bundles dmg
          - platform: windows-latest
            name: Windows
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Swift sidecar
        # macOS: real kivio-ocr-helper. Windows: empty stub for externalBin.
        run: npm run build:swift

      - name: Build and publish ${{ matrix.name }} installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Kivio Desktop ${{ env.RELEASE_TAG }}
          releaseBody: |
            Automated macOS (Apple Silicon / aarch64, unsigned) + Windows (x64) build for ${{ env.RELEASE_TAG }}.
            Built from: ${{ env.BUILD_REF }}
            - macOS: DMG (unsigned — first launch: right-click → Open, or `xattr -cr "/Applications/Kivio Desktop.app"`)
            - Windows: NSIS installer (.exe) and portable zip (unzip and run)
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'rc') }}
          includeUpdaterJson: false
          tauriScript: npx tauri
          args: ${{ matrix.args }}

      - name: Verify bundled skills in macOS DMG
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          mount_dir=$(mktemp -d)
          dmg=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir"; rmdir "$mount_dir"' EXIT
          resources="$mount_dir/Kivio Desktop.app/Contents/Resources"
          for skill in pdf docx xlsx obsidian-markdown obsidian-bases json-canvas obsidian-cli; do
            test -s "$resources/skills/$skill/SKILL.md"
            echo "Verified: skills/$skill/SKILL.md"
          done
          for skill in obsidian-markdown obsidian-bases json-canvas; do
            test -d "$resources/skills/$skill/references"
          done

      - name: Verify bundled skills in Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $inspectDir = Join-Path $env:RUNNER_TEMP ('kivio-installer-check-' + [guid]::NewGuid().ToString('n'))
          & 'C:/Program Files/7-Zip/7z.exe' x $installer.FullName "-o$inspectDir" -y
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract NSIS installer' }
          $files = Get-ChildItem -LiteralPath $inspectDir -Recurse -File
          foreach ($skill in @('pdf','docx','xlsx','obsidian-markdown','obsidian-bases','json-canvas','obsidian-cli')) {
            $match = $files | Where-Object { $_.FullName -match "[\\/]skills[\\/]$skill[\\/]SKILL\.md$" -and $_.Length -gt 0 }
            if (-not $match) { throw "Missing bundled skill: $skill" }
            Write-Host "Verified: skills/$skill/SKILL.md"
          }

      - name: Package and upload Windows portable zip
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = $env:RELEASE_TAG.TrimStart('v')
          & ./scripts/package-windows-portable.ps1 -Version $ver
          $zip = "src-tauri/target/release/bundle/portable/Kivio.Desktop_${ver}_x64-portable.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "portable zip not found: $zip" }
          gh release upload $env:RELEASE_TAG $zip --clobber --repo $env:GITHUB_REPOSITORY
